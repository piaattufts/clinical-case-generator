# Local development only. The password matches .env.example and is not a production secret.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinical_cases
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinical_cases"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - clinical_cases_pg:/var/lib/postgresql/data

volumes:
  clinical_cases_pg:
