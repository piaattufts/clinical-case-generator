[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical_case_generator"
version = "0.1.0"
description = "PostgreSQL schema for authoritative clinical reference data and synthetic cases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=1.60",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.36",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
clinical-case-generator = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E501"]
"app/services/readable_packets.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts"]
exclude = ["alembic/"]
warn_unused_ignores = true
plugins = []
